# =============================================================================
# EPANNs Finetuned Multiclass - AudioSet-EV v1 - Benchmark Configuration
# =============================================================================
# Benchmark EPANNs finetuned on AudioSet-EV v1 (multiclass task) across all datasets
#
# Training details:
#   - Dataset: AudioSet_EV_v1_2025
#   - Task: 4-class Emergency Vehicle classification (Traffic/Police/Ambulance/Fire)
#   - Best epoch: 5 (F1=0.5739)
#
# Usage:
#   python main_benchmark.py --config benchmark_configs/epanns_finetuned_multiclass_AS-EV_v1.yaml
# =============================================================================

# Model Configuration
model:
  name: "epanns"
  checkpoint_type: "finetuned"
  checkpoint_path: "./checkpoints/multiclass_EV/epanns_finetune_fixedLR_AS-EV_v1/epoch=005_val_f1=0.5739.ckpt"

# Benchmark Configuration
benchmark:
  batch_size: 32
  limit_test_batches: null
  datasets_to_test: []
  output_dir: "./benchmark_results"

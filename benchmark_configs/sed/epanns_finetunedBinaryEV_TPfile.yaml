# ============================================================================
# Single File SED Processing Configuration
# ============================================================================
# This configuration file defines settings for processing a single audio file
# for Emergency Vehicle Sound Event Detection using EPANNs finetuned model.
#
# Usage:
#   python main_file.py configs/example_file.yaml
#
# ============================================================================

# ============================================================================
# AUDIO INPUT
# ============================================================================
audio_file: "models/xAI/test_samps/TP_t2DrvtWfCqE.wav"

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
model:
  name: "epanns"  # Options: epanns, ced, clap
  checkpoint: "checkpoints/binary_EV/epanns_finetune_fixedLR_AS-EV_v2/epoch=002_val_f1=0.9625.pt"
  device: "cpu"   # Options: cpu, cuda

# ============================================================================
# INFERENCE SETTINGS
# ============================================================================
inference:
  # Detection threshold (0.0-1.0)
  threshold: 0.5
  
  # Minimum chunk duration for inference (seconds)
  # This should match the model's training window size
  chunk_duration: 0.310
  
  # Circular buffer duration for audio processing (seconds)
  buffer_duration: 20.0
  
  # Adaptive window width configuration
  # When model confidence is high, the inference window can be expanded
  # to reduce the number of inferences and improve throughput
  adaptive_window:
    enabled: true                   # Enable/disable adaptive window
    frame_duration_max: 1.0         # Maximum window duration when confidence is high (seconds)
    adapt_coeff: 0.4                # Adaptation coefficient (0.0-1.0)
                                    # 0.0 = always use chunk_duration
                                    # 1.0 = always use frame_duration_max when above threshold

# ============================================================================
# SED METRICS CONFIGURATION (optional, if ground truth available)
# ============================================================================
sed_metrics:
  # Path to ground truth file in DCASE format (optional)
  # Format: onset\toffset\tlabel (one event per line)
  ground_truth_file: null
  
  # Segment-based metrics: time resolution for frame-by-frame evaluation (seconds)
  # Should match chunk_duration for consistency
  segment_time_resolution: 0.310
  
  # Event-based metrics: tolerance for onset/offset matching (seconds)
  # Events are considered matching if onset/offset are within this tolerance
  event_tolerance: 0.500

# ============================================================================
# VISUALIZATION
# ============================================================================
visualization:
  # Enable plotting of predictions with spectrogram overlay
  plot_predictions: true
  
  # Path to save the visualization plot
  save_plot: "results/sed_single_file/epanns_finetunedBinaryEV_TP_t2DrvtWfCqE_predictions.png"

# ============================================================================
# OUTPUT SETTINGS (optional, for saving results)
# ============================================================================
output:
  # Directory for saving results (only used if save_results is true)
  dir: "results/sed_single_file"
  
  # Save results to CSV/JSON (optional, default: false)
  save_results: false
  
  # Save detected events to file (optional, default: false)
  save_events: false

# ============================================================================
# LOGGING
# ============================================================================
logging:
  level: "DEBUG"  # Options: DEBUG, INFO, WARNING, ERROR

# ============================================================================
# Dataset SED Processing Configuration - KineScaper-EV
# ============================================================================
# SED benchmark using EPANNs fine-tuned on AudioSet-EV v2.
# Runs on the KineScaper-EV dataset (full 40s samples with temporal annotations).
#
# Usage:
#   python main_sed_dataset.py benchmark_configs/sed/epanns_finetunedBinaryEV_AS-EV_v2_KineScaper-EV.yaml
# ============================================================================

dataset:
  name: "KineScaper_EV"  # Options: AudioSet_EV_v1, AudioSet_EV_v2, KineScaper_EV
  dataset_root: "/mnt/ssd/Kinescaper_EV/dataset/"
  metadata_format: "json"
  target_duration: 40.0
  max_samples: null

model:
  name: "epanns"
  checkpoint: "checkpoints/binary_EV/epanns_finetune_fixedLR_AS-EV_v2/epoch=002_val_f1=0.9625.pt"
  device: "cpu"  # Options: cpu, cuda, mps

inference:
  threshold: 0.5
  chunk_duration: 0.310
  buffer_duration: 20.0
  adaptive_window:
    enabled: true
    frame_duration_max: 1.0
    adapt_coeff: 0.4

sed_metrics:
  segment_time_resolution: 0.310
  event_tolerance: 0.500

output:
  dir: "results/sed_KineScaper_EV_epanns_finetuned_AS-EV_v2"
  save_per_sample: true
  save_events: false

multiprocessing:
  enabled: false
  num_workers: 0

logging:
  level: "INFO"
  log_file: "run.log"

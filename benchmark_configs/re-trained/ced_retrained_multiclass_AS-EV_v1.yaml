# =============================================================================
# CED Re-trained Multiclass - AudioSet-EV v1 - Benchmark Configuration
# =============================================================================
# Benchmark CED re-trained from scratch (non-pretrained) on AudioSet-EV v1 (multiclass task)
#
# Training details:
#   - Dataset: AudioSet_EV_v1_2025
#   - Task: 4-class Emergency Vehicle classification (Traffic/Police/Ambulance/Fire)
#   - Initialization: Random (Truncated Normal, no pretrained weights)
#   - Best epoch: 32 (F1=0.4611)
#
# Usage:
#   python main_benchmark.py --config benchmark_configs/re-trained/ced_retrained_multiclass_AS-EV_v1.yaml
# =============================================================================

# Model Configuration
model:
  name: "ced"
  checkpoint_type: "finetuned"
  checkpoint_path: "./checkpoints/re-training_EV/ced_scratch_multiclass_AS-EV_v1/epoch=032_val_f1=0.4611.ckpt"

# Benchmark Configuration
benchmark:
  batch_size: 32
  limit_test_batches: null
  datasets_to_test: []
  output_dir: "./benchmark_results"

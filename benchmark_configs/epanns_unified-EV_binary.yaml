# =============================================================================
# EPANNs Unified Multi-Dataset - Binary EV - Benchmark Configuration
# =============================================================================
# Benchmark EPANNs trained on unified multi-dataset (all 7 EV datasets) for binary task
#
# Training details:
#   - Datasets: AudioSet_EV_v1_2025 + AudioSet_EV_v2PANNs_2020 + sireNNet + 
#               LSSiren + ESC50 + FSD50K + UrbanSound8K
#   - Task: Binary Emergency Vehicle classification
#   - Total samples: 64,401 (51,519 train + 6,438 val + 6,444 test)
#   - Training strategy: Per-dataset split (80/10/10) + concatenation
#   - Augmentation: Enabled (training only, probability=0.5)
#   - Best epoch: 14 (val_f1=0.9164)
#   - Learning rate: 0.001 (fixed)
#   - Batch size: 4 (effective=32 with gradient accumulation)
#
# Usage:
#   python main_benchmark.py --config benchmark_configs/epanns_unified-EV_binary.yaml
# =============================================================================

# Model Configuration
model:
  name: "epanns"
  checkpoint_type: "finetuned"
  checkpoint_path: "./checkpoints/unified_training_EV/epoch=014_val_f1=0.9164.ckpt"

# Benchmark Configuration
benchmark:
  batch_size: 32
  limit_test_batches: null
  datasets_to_test: []
  output_dir: "./benchmark_results_unified_EV"


# =============================================================================
# Unified Multi-Dataset Training Configuration
# =============================================================================
# Trains EPANNs on unified dataset combining all 7 EV datasets
# Task: Binary classification (Emergency Vehicle vs Non-EV)
# Author: Stefano Giacomelli - Ph.D. candidate in ICT (DISIM dpt. - University of L'Aquila)

experiment:
  name: "epanns_unified_binary_EV"
  task: "binary"
  model_name: "epanns"
  pretrained: true
  seed: 42

data:
  # Audio preprocessing
  target_sr: 32000
  target_duration: 10.0  # seconds (fixed length: 320000 samples @ 32kHz)
  
  # Training parameters
  batch_size: 4  # small batch to avoid OOM
  accumulate_grad_batches: 8  # simulates batch_size=32 (4×8)
  split_ratios: [0.8, 0.1, 0.1]  # train/val/test
  
  # Batch limits for quick testing (comment out for full training)
  # train_batch_limit: 1
  # val_batch_limit: 1
  # test_batch_limit: 1
  
  # Data augmentation (applied to training set only)
  augmentation:
    enabled: true
    probability: 0.5  # probability of applying each augmentation technique
  
  # Datasets to include in unified training
  # All 7 datasets will be concatenated and split globally
  datasets:
    - AudioSet_EV_v1_2025
    - AudioSet_EV_v2PANNs_2020
    - sireNNet
    - LSSiren
    - ESC50
    - FSD50K
    - UrbanSound8K

training:
  # Training duration
  max_epochs: 100
  patience: 25  # early stopping patience
  
  # Optimizer (Adam with fixed learning rate)
  optimizer:
    lr: 0.001  # fixed learning rate (no scheduler)
    weight_decay: 1.0e-6
    betas: [0.9, 0.999]
    eps: 1.0e-8
    
  # Scheduler (exponential with gamma=1.0 for fixed LR)
  scheduler:
    type: "exponential"
    gamma: 1.0  # no decay = fixed learning rate

model:
  # Binary classification threshold
  threshold: 0.5
  
  # F-beta score (beta=0.8 weights precision slightly higher than recall)
  f_beta: 0.8

paths:
  # Data root directory
  data_root: "./datasets"
  
  # Results, checkpoints, and logs
  results: "./results/unified_training_EV"
  checkpoints: "./checkpoints/unified_training_EV"
  logs: "./logs/unified_training_EV"
